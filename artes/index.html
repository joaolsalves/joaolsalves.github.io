<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fundo Animado Preto - Partículas Sutis</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: #000000;
      overflow: hidden;
    }

    /* Gradiente extremamente sutil */
    .gradient-bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse at center,
        rgba(8, 0, 35, 0.08) 0%,
        rgba(0, 0, 0, 0.25) 50%,
        #000000 80%
      );
      opacity: 0.7;
      z-index: 1;
    }

    /* Partículas */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      background: rgba(100, 160, 255, 0.35);
      border-radius: 50%;
      box-shadow: 
        0 0 8px rgba(100, 160, 255, 0.4),
        0 0 20px rgba(80, 140, 255, 0.15);
      animation: float linear infinite;
      will-change: transform, opacity;
    }

    @keyframes float {
      0% {
        transform: translateY(120vh) scale(0.2);
        opacity: 0;
      }
      10% { opacity: 0.7; }
      90% { opacity: 0.7; }
      100% {
        transform: translateY(-40vh) scale(0.45);
        opacity: 0;
      }
    }

    /* Conteúdo opcional (remova se quiser só o fundo) */
    .content {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #d0d0ff;
      text-align: center;
      padding: 20px;
      pointer-events: none;
    }

    h1 {
      font-size: 4.8rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 35px rgba(100, 160, 255, 0.4);
    }

    p {
      font-size: 1.4rem;
      max-width: 700px;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="gradient-bg"></div>

  <div class="particles" id="particles"></div>

  <!-- Remova esta div .content se quiser fundo limpo -->
  <div class="content">
    <h1>Partículas Sutis</h1>
    <p>Mais partículas, mais discretas, mais atmosférico</p>
  </div>

  <script>
    const particlesContainer = document.getElementById('particles');
    const colors = [
      '#70b0ff',    // azul suave
      '#a0b8ff',    // azul claro sutil
      '#c0a8ff',    // roxo-azulado leve
      '#80d4ff',    // ciano suave
      '#b0c4ff'
    ];

    function createParticle() {
      const particle = document.createElement('div');
      particle.classList.add('particle');

      // Partículas bem pequenas e sutis
      const size = Math.random() * 3 + 1.2;
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;

      particle.style.left = Math.random() * 100 + 'vw';
      
      // Velocidade bem lenta
      const duration = Math.random() * 50 + 35; // 35 a 85 segundos
      particle.style.animationDuration = `${duration}s`;
      particle.style.animationDelay = (Math.random() * -60) + 's';

      const color = colors[Math.floor(Math.random() * colors.length)];
      particle.style.background = color;
      particle.style.boxShadow = `0 0 ${size*5}px ${color.replace(')', ', 0.35)')}`;

      particlesContainer.appendChild(particle);

      // Remove após terminar
      setTimeout(() => particle.remove(), (duration + 5) * 1000);
    }

    // Cria partículas com mais frequência para maior densidade
    setInterval(createParticle, 180); // ~a cada 0.18s uma nova

    // Preenche a tela rapidamente no início com mais partículas
    for (let i = 0; i < 140; i++) {
      createParticle();
    }
  </script>

</body>
</html>
