<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Responsivo</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    scroll-behavior: smooth;
}

body {
    background: #f4f4f4;
}

/* ===== HEADER ===== */
header {
    background: #222;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
    position: fixed;
    width: 100%;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

/* MENU DESKTOP */
nav ul {
    list-style: none;
    display: flex;
    gap: 20px;
}

nav ul li a {
    color: white;
    text-decoration: none;
    transition: 0.3s;
}

nav ul li a:hover {
    color: #00bcd4;
}

/* BOTÃO HAMBURGUER */
.hamburguer {
    display: none;
    flex-direction: column;
    cursor: pointer;
    gap: 5px;
}

.hamburguer span {
    width: 25px;
    height: 3px;
    background: white;
    transition: 0.3s;
}

/* RESPONSIVO */
@media (max-width: 768px) {

    nav {
        position: absolute;
        top: 60px;
        right: 0;
        background: #222;
        width: 220px;
        display: none;
        flex-direction: column;
        padding: 20px;
    }

    nav ul {
        flex-direction: column;
        gap: 15px;
    }

    nav.active {
        display: flex;
    }

    .hamburguer {
        display: flex;
    }
}

/* SEÇÕES */
section {
    padding: 100px 20px;
    min-height: 100vh;
}

#inicio { background: #ffffff; }
#sobre { background: #e9e9e9; }
#servicos { background: #dcdcdc; }
#contato { background: #cfcfcf; }

h1, h2 {
    margin-bottom: 20px;
}
</style>
</head>

<body>

<header>
    <div class="logo">Meu Site</div>

    <div class="hamburguer" id="btnMenu">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <nav id="menu">
        <ul>
            <li><a href="#inicio">Início</a></li>
            <li><a href="#sobre">Sobre</a></li>
            <li><a href="#servicos">Serviços</a></li>
            <li><a href="#contato">Contato</a></li>
        </ul>
    </nav>
</header>

<section id="inicio">
    <h1>Início</h1>
    <p>Bem-vindo ao site.</p>
</section>

<section id="sobre">
    <h2>Sobre</h2>
    <p>Informações sobre a empresa.</p>
</section>

<section id="servicos">
    <h2>Serviços</h2>
    <p>Descrição dos serviços oferecidos.</p>
</section>

<section id="contato">
    <h2>Contato</h2>
    <p>Email, telefone e formulário.</p>
</section>

<script>
const btn = document.getElementById("btnMenu");
const menu = document.getElementById("menu");
const links = document.querySelectorAll("nav a");

// Abrir e fechar menu
btn.addEventListener("click", () => {
    menu.classList.toggle("active");
});

// Fechar menu ao clicar em qualquer link (mobile)
links.forEach(link => {
    link.addEventListener("click", () => {
        menu.classList.remove("active");
    });
});
</script>

</body>
</html>
