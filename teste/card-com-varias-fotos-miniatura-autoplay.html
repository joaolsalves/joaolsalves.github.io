<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Galeria Profissional</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f4f6f9;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.card {
  width: 420px;
  background: #fff;
  box-shadow: 0 25px 50px rgba(0,0,0,0.08);
  overflow: hidden;
}

.gallery-wrapper {
  position: relative;
  overflow: hidden;
}

.gallery {
  display: flex;
  transition: transform 0.5s ease;
}

.gallery img {
  width: 100%;
  height: 260px;
  object-fit: cover;
  flex-shrink: 0;
}

button {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.5);
  color: #fff;
  border: none;
  padding: 10px 14px;
  cursor: pointer;
  font-size: 18px;
  transition: background 0.3s ease;
}

button:hover {
  background: rgba(0,0,0,0.7);
}

.prev { left: 10px; }
.next { right: 10px; }

.thumbnails {
  display: flex;
  gap: 8px;
  padding: 12px;
  justify-content: center;
  background: #fafafa;
}

.thumbnails img {
  width: 60px;
  height: 60px;
  object-fit: cover;
  cursor: pointer;
  opacity: 0.6;
  transition: 0.3s;
  border: 2px solid transparent;
}

.thumbnails img.active {
  opacity: 1;
  border: 2px solid #111;
}

.card-title {
  padding: 18px;
  font-size: 1.2rem;
  font-weight: 600;
  text-align: center;
}
</style>
</head>
<body>

<div class="card">
  <div class="gallery-wrapper">
    <div class="gallery" id="gallery">
      <img src="https://picsum.photos/id/1015/600/400">
      <img src="https://picsum.photos/id/1016/600/400">
      <img src="https://picsum.photos/id/1018/600/400">
      <img src="https://picsum.photos/id/1020/600/400">
      <img src="https://picsum.photos/id/1024/600/400">
    </div>
    <button class="prev" onclick="moveSlide(-1)">‹</button>
    <button class="next" onclick="moveSlide(1)">›</button>
  </div>

  <div class="thumbnails" id="thumbnails"></div>

  <div class="card-title">Violão Artesanal Premium</div>
</div>

<script>
const gallery = document.getElementById("gallery");
const thumbnailsContainer = document.getElementById("thumbnails");
const images = gallery.querySelectorAll("img");

let index = 0;
let interval;

images.forEach((img, i) => {
  const thumb = document.createElement("img");
  thumb.src = img.src;
  if(i === 0) thumb.classList.add("active");

  thumb.addEventListener("click", () => {
    index = i;
    updateGallery();
    resetAutoplay();
  });

  thumbnailsContainer.appendChild(thumb);
});

function updateGallery() {
  gallery.style.transform = `translateX(-${index * 100}%)`;

  document.querySelectorAll(".thumbnails img").forEach((img, i) => {
    img.classList.toggle("active", i === index);
  });
}

function moveSlide(direction) {
  index += direction;
  if(index >= images.length) index = 0;
  if(index < 0) index = images.length - 1;
  updateGallery();
  resetAutoplay();
}

function autoplay() {
  interval = setInterval(() => {
    index++;
    if(index >= images.length) index = 0;
    updateGallery();
  }, 3000);
}

function resetAutoplay() {
  clearInterval(interval);
  autoplay();
}

autoplay();
</script>

</body>
</html>
