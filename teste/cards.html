<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Card Profissional Responsivo</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      font-family: Arial, sans-serif;
    }

    /* CARD */
    .card {
      width: clamp(280px, 90vw, 340px);
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      animation: fadeUp 0.8s ease forwards;
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 30px 50px rgba(0,0,0,0.15);
    }

    /* IMAGEM */
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    /* CONTEÚDO */
    .card-content {
      padding: 24px;
      text-align: center;
    }

    .icon {
      width: 60px;
      height: 60px;
      background: #4f46e5;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: -50px auto 16px;
      box-shadow: 0 10px 20px rgba(79,70,229,0.4);
      animation: pulse 2.5s infinite;
    }

    .card-content h3 {
      font-size: clamp(1.2rem, 3vw, 1.4rem);
      margin-bottom: 10px;
    }

    .card-content p {
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      color: #475569;
      margin-bottom: 20px;
    }

    /* BOTÃO */
    .card-btn {
      display: inline-block;
      padding: 12px 28px;
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: white;
      text-decoration: none;
      border-radius: 999px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(79,70,229,0.4);
    }

    /* ANIMAÇÕES */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    /* MOBILE EXTRA */
    @media (max-width: 480px) {
      .card img {
        height: 180px;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <img src="https://picsum.photos/600/400" alt="Imagem ilustrativa">

    <div class="card-content">
      <div class="icon">⭐</div>

      <h3>Card Profissional</h3>
      <p>
        Exemplo moderno, responsivo e animado para destacar serviços ou conteúdos importantes.
      </p>

      <a href="#" class="card-btn">Saiba mais</a>
    </div>
  </div>

  <script>
    // JS reservado para futuras interações
    console.log("Card carregado com sucesso");
  </script>

</body>
</html>
