<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Página com Header Fixo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      padding-top: 100px; /* espaço para o header fixo */
      font-family: Arial, sans-serif;
      background: red;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100px;
      background: #222;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    section {
      min-height: calc(100vh - 100px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    .section1 {
      background: #f2f2f2;
    }

    .section2 {
      background: #d9d9d9;
    }

    .section3 {
      background: #bfbfbf;
    }
  </style>
</head>
<body>

  <header>
    Header Fixo (100px)

    <div id="secao0" class="secao0">
        <ul>
            <a href="#secao0">secao0</a>
            <a href="#section1">secao1</a>
            <a href="#section2">secao2</a>
            <a href="#section3">secao3</a>
            <a href="#secao4">secao4</a>
        </ul>
    </div>
  </header>

  <section id="section1" class="section1">
    Section 1
  </section>

  <section id="section2" class="section2">
    Section 2
  </section>

  <section id="section3" class="section3">
    Section 3
  </section>

</body>
</html>
