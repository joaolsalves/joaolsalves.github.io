<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Botões com CSS Transition</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    padding: 40px;
  }

  h1 {
    margin-bottom: 30px;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
  }

  button {
    padding: 15px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #fff;
    background: #4f46e5;

    /* Transição base */
    transition: all 0.3s ease;
  }

  /* 1️⃣ Cor */
  .btn-color:hover {
    background: #22c55e;
  }

  /* 2️⃣ Escala */
  .btn-scale:hover {
    transform: scale(1.1);
  }

  /* 3️⃣ Movimento */
  .btn-move:hover {
    transform: translateY(-6px);
  }

  /* 4️⃣ Opacidade */
  .btn-opacity:hover {
    opacity: 0.6;
  }

  /* 5️⃣ Sombra */
  .btn-shadow:hover {
    box-shadow: 0 15px 25px rgba(0, 0, 0, 0.3);
  }

  /* 6️⃣ Borda */
  .btn-radius:hover {
    border-radius: 30px;
  }

  /* 7️⃣ Rotação */
  .btn-rotate:hover {
    transform: rotate(-3deg);
  }

  /* 8️⃣ Combo (profissional) */
  .btn-combo:hover {
    background: #ec4899;
    transform: translateY(-6px) scale(1.05);
    box-shadow: 0 20px 30px rgba(0,0,0,0.35);
  }

  /* Foco (acessibilidade) */
  button:focus {
    outline: 3px solid #93c5fd;
    outline-offset: 3px;
  }
</style>
</head>

<body>

<h1>Botões com efeitos de CSS Transition</h1>

<div class="buttons">
  <button class="btn-color">Cor</button>
  <button class="btn-scale">Escala</button>
  <button class="btn-move">Movimento</button>
  <button class="btn-opacity">Opacidade</button>
  <button class="btn-shadow">Sombra</button>
  <button class="btn-radius">Borda</button>
  <button class="btn-rotate">Rotação</button>
  <button class="btn-combo">Combo</button>
</div>

</body>
</html>
