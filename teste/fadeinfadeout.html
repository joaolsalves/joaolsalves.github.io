<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fade In / Fade Out - CSS</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f8fafc;
    padding: 40px;
  }

  h1 {
    margin-bottom: 10px;
  }

  p {
    margin-bottom: 30px;
    color: #475569;
  }

  .container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
  }

  /* Base */
  .box {
    height: 140px;
    background: #4f46e5;
    color: #fff;
    border-radius: 10px;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: opacity 0.4s ease;
  }

  /* 1️⃣ Fade Out no hover */
  .fade-out:hover {
    opacity: 0;
  }

  /* 2️⃣ Fade In no hover */
  .fade-in {
    opacity: 0;
  }

  .fade-in:hover {
    opacity: 1;
  }

  /* 3️⃣ Fade In + movimento (mais natural) */
  .fade-move {
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .fade-move:hover {
    opacity: 1;
    transform: translateY(0);
  }

  /* 4️⃣ Fade Out suave (overlay) */
  .fade-overlay {
    position: relative;
    overflow: hidden;
  }

  .fade-overlay::after {
    content: "Overlay";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);

    display: flex;
    align-items: center;
    justify-content: center;

    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .fade-overlay:hover::after {
    opacity: 1;
  }

  /* 5️⃣ Fade In automático (simula carregamento) */
  .fade-load {
    opacity: 0;
    animation: fadeIn 1.2s ease forwards;
  }

  @keyframes fadeIn {
    to {
      opacity: 1;
    }
  }
</style>
</head>

<body>

<h1>Exemplos de Fade In e Fade Out</h1>
<p>Passe o mouse sobre os blocos para ver os efeitos</p>

<div class="container">
  <div class="box fade-out">Fade Out</div>
  <div class="box fade-in">Fade In</div>
  <div class="box fade-move">Fade + Move</div>
  <div class="box fade-overlay">Overlay</div>
  <div class="box fade-load">Fade Load</div>
</div>

</body>
</html>
