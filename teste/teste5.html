<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Produto</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #f5f7fa, #e9edf2);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.card {
  width: 320px;
  background: #ffffff;
  overflow: hidden;
  box-shadow: 0 25px 50px rgba(0,0,0,0.08);
  transition: transform 0.35s ease, box-shadow 0.35s ease;
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 35px 70px rgba(0,0,0,0.12);
}

.card img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  display: block;
}

.card-content {
  padding: 28px;
}

.card-title {
  font-size: 1.2rem;
  font-weight: 600;
  color: #111;
  margin-bottom: 24px;
}

.card-button {
  display: block;
  text-align: center;
  padding: 14px;
  background: linear-gradient(135deg, #111, #333);
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  letter-spacing: 0.6px;
  transition: all 0.3s ease;
}

.card-button:hover {
  background: linear-gradient(135deg, #000, #222);
  transform: scale(1.03);
}
</style>

</head>
<body>

<div class="card">
  <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8" alt="Produto">
  <div class="card-content">
    <div class="card-title">Notebook Premium XZ</div>
    <a href="#" class="card-button">CONSULTE</a>
  </div>
</div>

</body>
</html>
