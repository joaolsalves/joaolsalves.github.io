<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Lightbox com Navegação</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    header {
      text-align: center;
      padding: 40px 20px;
    }

    /* GALERIA */
    .gallery {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .gallery img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 25px rgba(0,0,0,0.15);
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;

      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
      z-index: 999;
    }

    .lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox img {
      max-width: 85%;
      max-height: 85%;
      border-radius: 14px;
      animation: zoom 0.4s ease;
    }

    @keyframes zoom {
      from { transform: scale(0.85); }
      to { transform: scale(1); }
    }

    /* BOTÕES */
    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 40px;
      color: white;
      cursor: pointer;
      user-select: none;
    }

    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 50px;
      color: white;
      cursor: pointer;
      user-select: none;
      padding: 10px;
    }

    .prev { left: 30px; }
    .next { right: 30px; }

    .nav:hover,
    .close:hover {
      color: #c7d2fe;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .nav {
        font-size: 40px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Galeria com Lightbox</h1>
  <p>Clique e navegue pelas imagens</p>
</header>

<main class="gallery">
  <img src="https://picsum.photos/id/1015/800/600">
  <img src="https://picsum.photos/id/1025/800/600">
  <img src="https://picsum.photos/id/1035/800/600">
  <img src="https://picsum.photos/id/1045/800/600">
</main>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="close" id="close">&times;</span>
  <span class="nav prev" id="prev">&#10094;</span>
  <img id="lightbox-img">
  <span class="nav next" id="next">&#10095;</span>
</div>

<script>
  const images = document.querySelectorAll(".gallery img");
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");
  const closeBtn = document.getElementById("close");
  const nextBtn = document.getElementById("next");
  const prevBtn = document.getElementById("prev");

  let currentIndex = 0;

  function showImage(index) {
    currentIndex = (index + images.length) % images.length;
    lightboxImg.src = images[currentIndex].src;
  }

  images.forEach((img, index) => {
    img.addEventListener("click", () => {
      lightbox.classList.add("active");
      showImage(index);
    });
  });

  nextBtn.addEventListener("click", () => showImage(currentIndex + 1));
  prevBtn.addEventListener("click", () => showImage(currentIndex - 1));

  closeBtn.addEventListener("click", () => {
    lightbox.classList.remove("active");
  });

  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) {
      lightbox.classList.remove("active");
    }
  });

  document.addEventListener("keydown", (e) => {
    if (!lightbox.classList.contains("active")) return;

    if (e.key === "ArrowRight") showImage(currentIndex + 1);
    if (e.key === "ArrowLeft") showImage(currentIndex - 1);
    if (e.key === "Escape") lightbox.classList.remove("active");
  });
</script>

</body>
</html>
