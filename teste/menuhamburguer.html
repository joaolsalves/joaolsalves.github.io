<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Sanduíche</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
  }

  /* HEADER */
  header {
    position: fixed;
    top: 0;
    width: 100%;
    height: 60px;
    background: #0f172a;
    color: #fff;
    display: flex;
    align-items: center;
    padding: 0 20px;
    z-index: 1000;
  }

  .logo {
    flex: 1;
    font-weight: bold;
  }

  /* BOTÃO HAMBURGER */
  .hamburger {
    width: 30px;
    height: 22px;
    display: none;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
  }

  .hamburger span {
    height: 4px;
    background: #fff;
    border-radius: 2px;
    transition: 0.3s;
  }

  /* MENU */
  nav {
    display: flex;
    gap: 20px;
  }

  nav a {
    color: #fff;
    text-decoration: none;
    font-weight: bold;
  }

  /* MOBILE */
  @media (max-width: 768px) {
    .hamburger {
      display: flex;
    }

    nav {
      position: fixed;
      top: 60px;
      right: -100%;
      width: 70%;
      height: 100vh;
      background: #020617;
      flex-direction: column;
      padding: 30px;
      gap: 20px;
      transition: right 0.3s ease;
    }

    nav.active {
      right: 0;
    }
  }

  /* CONTEÚDO */
  main {
    padding-top: 80px;
  }

  section {
    min-height: 100vh;
    padding: 40px;
  }

  section:nth-child(odd) {
    background: #e0e7ff;
  }

  section:nth-child(even) {
    background: #cffafe;
  }
</style>
</head>

<body>

<header>
  <div class="logo">LOGO</div>

  <div class="hamburger" id="hamburger">
    <span></span>
    <span></span>
    <span></span>
  </div>
  
    <nav id="menu">
    <a href="#home">Home</a>
    <a href="#sobre">Sobre</a>
    <a href="#servicos">Serviços</a>
    <a href="#contato">Contato</a>
  </nav>
 
</header>

<main>
  <section id="home">
    <h1>Home</h1>
  </section>

  <section id="sobre">
    <h1>Sobre</h1>
  </section>

  <section id="servicos">
    <h1>Serviços</h1>
  </section>

  <section id="contato">
    <h1>Contato</h1>
  </section>
</main>

<script>
  const hamburger = document.getElementById("hamburger");
  const menu = document.getElementById("menu");
  const links = menu.querySelectorAll("a");

  hamburger.addEventListener("click", () => {
    menu.classList.toggle("active");
  });

  links.forEach(link => {
    link.addEventListener("click", () => {
      menu.classList.remove("active");
    });
  });
</script>

</body>
</html>
